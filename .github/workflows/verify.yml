name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python3 -m pip install --disable-pip-version-check 'weasyprint==68.0' 'pymupdf==1.26.7' 'pillow==11.3.0'
      - name: Build independent HTML pages
        run: python3 scripts/build.py
      - name: Build and inspect searchable PDF from source
        run: |
          python3 scripts/build_pdf.py --output _site/pdf/seo-handbook-guide.pdf
          python3 scripts/pdf_quality_gate.py _site/pdf/seo-handbook-guide.pdf --qa-dir qa/pdf
      - name: Save PDF and all-page rendering evidence
        uses: actions/upload-artifact@v4
        with:
          name: seo-handbook-pdf-qa
          path: |
            _site/pdf/seo-handbook-guide.pdf
            qa/pdf/
          retention-days: 30
      - name: Static site SEO audit
        run: python3 scripts/site_audit.py _site
      - name: Unit and failure-injection tests
        run: python3 -m unittest discover -s tests -v
      - name: Client-side JS logic tests
        run: node tests/check_client.js
